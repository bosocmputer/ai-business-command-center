name: ai-business-command-center

services:
  system-db:
    container_name: ai-bcc-system-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AI_BCC_SYSTEM_DB_NAME:-ai_business_command_center}
      POSTGRES_USER: ${AI_BCC_SYSTEM_DB_USER:-ai_bcc}
      POSTGRES_PASSWORD: ${AI_BCC_SYSTEM_DB_PASSWORD:-change-me-local-only}
    volumes:
      - ai_bcc_system_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AI_BCC_SYSTEM_DB_USER:-ai_bcc} -d ${AI_BCC_SYSTEM_DB_NAME:-ai_business_command_center}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    container_name: ai-bcc-api
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${AI_BCC_API_PORT:-4055}:4000"
    env_file:
      - ${AI_BCC_ENV_FILE:-../.env.server}
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      SYSTEM_STORE_FILE: /app/.data/system-store.json
    volumes:
      - ai_bcc_data:/app/.data
    depends_on:
      system-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    container_name: ai-bcc-web
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://192.168.2.109:4055}
    restart: unless-stopped
    ports:
      - "${AI_BCC_WEB_PORT:-3055}:3000"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy

  worker:
    container_name: ai-bcc-worker
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ${AI_BCC_ENV_FILE:-../.env.server}
    environment:
      MORNING_BRIEF_ENABLED: ${MORNING_BRIEF_ENABLED:-true}
      MORNING_BRIEF_API_BASE_URL: http://api:4000
      MORNING_BRIEF_TENANT_IDS: ${MORNING_BRIEF_TENANT_IDS:-tenant_demo_remote}
      MORNING_BRIEF_TIMEZONE: ${MORNING_BRIEF_TIMEZONE:-Asia/Bangkok}
      MORNING_BRIEF_TIME: ${MORNING_BRIEF_TIME:-08:00}
      MORNING_BRIEF_MODE: ${MORNING_BRIEF_MODE:-send}
      MORNING_BRIEF_FORCE: ${MORNING_BRIEF_FORCE:-false}
      WORKER_ID: ${WORKER_ID:-worker_morning_brief_1}
      WORKER_HEARTBEAT_TOKEN: ${WORKER_HEARTBEAT_TOKEN:-}
      AI_BCC_ADMIN_TOKEN: ${AI_BCC_ADMIN_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  ai_bcc_system_pgdata:
    name: ai_bcc_system_pgdata
  ai_bcc_data:
    name: ai_bcc_data
